services:
  nginx:
    image: nginx:1.22
    ports:
      - 8190:80
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ImOxO8Lz
      MYSQL_DATABASE: xtreme1
      MYSQL_USER: xtreme1
      MYSQL_PASSWORD: Rc4K3L6f
    ports:
      - 8191:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
      # Ordered migrations via docker-init (do not mount migration/ directly into
      # docker-entrypoint-initdb.d — MySQL runs those scripts in filename order and
      # can execute V19 before V16/V17/V18).
      - ./deploy/mysql/migration:/migrations:ro
      - ./deploy/mysql/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: '/usr/bin/mysql --user=xtreme1 --password=Rc4K3L6f --execute "SHOW DATABASES;"'
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  redis:
    image: redis:6.2
    ports:
      - 8192:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  minio:
    #image: bitnami/minio:2022.9.1
    image: bitnamilegacy/minio:2022.9.1
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 1tQB970y
      MINIO_DEFAULT_BUCKETS: xtreme1:download
    ports:
      - 8193:9000
      - 8194:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "-f",
          "http://minio:9000/minio/health/ready"
        ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  backend:
    build: ./backend
    # image: basicai/xtreme1-backend:v0.9.1
    # pull_policy: always
    ports:
      - 8290:8080
    # volumes:
    # Using customized application.yml to override default configs.
    #   - /host/path/to/customized/application.yml:/app/config/application.yml
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "-f",
          "http://backend:8080/actuator/health"
        ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  frontend:
    build: ./frontend
    # image: basicai/xtreme1-frontend:v0.9.1
    # pull_policy: always
    ports:
      - 8291:80
  pcd-tools:
    image: basicai/xtreme1-pcd-tools
    pull_policy: always
    ports:
      - 8295:5000
  image-vect-visualization:
    image: basicai/xtreme1-image-vect-visualization
    pull_policy: always
    ports:
      - 8294:5000
  image-object-detection:
    image: basicai/xtreme1-image-object-detection
    pull_policy: always
    ports:
      - 8292:5000
    # You need to explicitly specify model profile to start this service.
    profiles:
      - model
    gpus: all
  point-cloud-object-detection:
    image: basicai/xtreme1-point-cloud-object-detection
    pull_policy: always
    ports:
      - 8293:5000
    # You need to explicitly specify model profile to start this service.
    profiles:
      - model
    gpus: all
  point-cloud-object-tracking:
    build:
      context: ./deploy/point-cloud-object-tracking
      args:
        BASE_IMAGE: ${TRACKING_BASE_IMAGE:-python:3.10-slim}
        INSTALL_MMLAB: ${TRACKING_INSTALL_MMLAB:-false}
    environment:
      TRACKING_BACKEND: ${TRACKING_BACKEND:-auto}
      MODEL_DEVICE: ${TRACKING_MODEL_DEVICE:-cuda:0}
      CENTERPOINT_CONFIG: ${CENTERPOINT_CONFIG:-/models/centerpoint_nuscenes.py}
      CENTERPOINT_CHECKPOINT: ${CENTERPOINT_CHECKPOINT:-/models/centerpoint_nuscenes.pth}
      CENTERPOINT_AUTO_DOWNLOAD: ${CENTERPOINT_AUTO_DOWNLOAD:-true}
      CENTERPOINT_CONFIG_URL: ${CENTERPOINT_CONFIG_URL:-https://raw.githubusercontent.com/open-mmlab/mmdetection3d/main/configs/centerpoint/centerpoint_voxel0075_second_secfpn_head-circlenms_8xb4-cyclic-20e_nus-3d.py}
      CENTERPOINT_CHECKPOINT_URL: ${CENTERPOINT_CHECKPOINT_URL:-https://download.openmmlab.com/mmdetection3d/v1.0.0_models/centerpoint/centerpoint_0075voxel_second_secfpn_circlenms_4x8_cyclic_20e_nus/centerpoint_0075voxel_second_secfpn_circlenms_4x8_cyclic_20e_nus_20220810_011659-04cb3a3b.pth}
      CENTERPOINT_SCORE_THRESHOLD: ${CENTERPOINT_SCORE_THRESHOLD:-0.25}
      TRACK_MATCH_MAX_DISTANCE: ${TRACK_MATCH_MAX_DISTANCE:-4.0}
    volumes:
      - ./deploy/point-cloud-object-tracking/weights:/models
    ports:
      - 8296:5000
    profiles:
      - model
    gpus: all
volumes:
  mysql-data:
  redis-data:
  minio-data:
